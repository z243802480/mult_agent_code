name: Verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Verify
        run: bash scripts/verify.sh

  studio-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Studio server shells out to the Python runtime for real actions (resolving a decision,
      # running a next action). Without it the UI specs can click the button but nothing ever happens
      # — so the UI job needs the runtime installed, not just Node.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Asteria runtime
        working-directory: .
        run: python -m pip install -e .

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The UI specs are hermetic: each boots its own Studio server against a seeded temp workspace.
      # They used to be un-runnable in CI (one keyed off the developer's local .asteria/runs), which
      # is exactly how they rotted unnoticed.
      - name: UI tests
        run: npm run test:ui
