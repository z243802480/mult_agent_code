name: Verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Verify
        run: bash scripts/verify.sh

  studio-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Studio server shells out to the Python runtime for real actions (resolving a decision,
      # running a next action). Without it the UI specs can click the button but nothing ever happens
      # — so the UI job needs the runtime installed, not just Node.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install the dev extras, not just the runtime: a few Python-shelling smokes reuse test
      # fixtures (e.g. tests.integration.test_plan_command.FakePlanClient), which import pytest.
      # With a bare `-e .` those smokes die on ModuleNotFoundError: pytest in CI while passing
      # locally where pytest is already present.
      - name: Install Asteria runtime
        working-directory: .
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The ~33 hermetic Studio smokes (scripts/run-smokes.mjs). They used to exist but never run in
      # CI, so the chronically-red ones rotted unnoticed. The runner also fails if any smoke on disk is
      # unclassified, so a new one can't silently escape coverage. Real-model smokes are held out here
      # (no provider key in CI) and run via `npm run test:smokes:all` with a key.
      - name: Studio smokes
        run: npm run test:smokes

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The UI specs are hermetic: each boots its own Studio server against a seeded temp workspace.
      # They used to be un-runnable in CI (one keyed off the developer's local .asteria/runs), which
      # is exactly how they rotted unnoticed.
      - name: UI tests
        run: npm run test:ui
