name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Green-light gate: run the full Verify suite (pytest matrix + ruff + mypy ratchet + benchmarks +
  # ring-recovery + CLI e2e, and the Studio lint/typecheck/unit/smoke/UI job) BEFORE building or
  # publishing. build-release needs this, so a tag push whose code is red never ships an asset.
  verify:
    uses: ./.github/workflows/verify.yml

  # Reaudit debt #2: the offline Verify gate deselects every real_provider test (pyproject addopts
  # -m "not real_provider"), and the REAL stack proof lives in the ring-recovery nightly — which
  # the release never looked at. This job closes the loop: a red nightly blocks the release, a
  # skipped/never-run nightly (no provider secrets) ships with the gap stated in big letters, and
  # a green nightly is stamped with its time and link. Honesty at the gate, not "someone should
  # watch the nightly".
  real-stack-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report latest real-stack (ring-recovery) nightly result
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          run_json="$(gh run list --workflow=ring-recovery-nightly.yml --branch "$DEFAULT_BRANCH" --limit 1 --json databaseId,status,conclusion,createdAt,url || printf 'null')"
          jobs_json='{}'
          if [ "$run_json" != 'null' ] && [ "$run_json" != '[]' ]; then
            run_id="$(printf '%s' "$run_json" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['databaseId'])")"
            jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" || true)"
          fi
          PROOF_KIND=ring RUN_JSON="$run_json" JOBS_JSON="$jobs_json" python3 scripts/nightly_release_proof.py

  # S92: Studio keyed smokes are evidence for the release operator, but remain non-blocking until
  # there is a real history of successful runs. An old nightly without this job is reported as
  # NEVER RUN instead of being mistaken for Studio proof.
  studio-real-model-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report latest Studio real-model nightly result
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          run_json="$(gh run list --workflow=nightly.yml --branch "$DEFAULT_BRANCH" --limit 1 --json databaseId,status,createdAt,url || printf 'null')"
          jobs_json='{}'
          if [ "$run_json" != 'null' ] && [ "$run_json" != '[]' ]; then
            run_id="$(printf '%s' "$run_json" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['databaseId'])")"
            jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" || true)"
          fi
          RUN_JSON="$run_json" JOBS_JSON="$jobs_json" python3 scripts/nightly_release_proof.py

  build-release:
    needs: [verify, real-stack-proof, studio-real-model-proof]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install Studio dependencies
        working-directory: studio
        run: npm ci

      - name: Build Beta release assets
        run: python scripts/build_beta_release.py --root .

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/asteria_runtime-*.whl
            dist/asteria-studio-*.zip
            dist/asteria-beta-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: beta-release-assets
          path: |
            dist/asteria_runtime-*.whl
            dist/asteria-studio-*.zip
            dist/asteria-beta-*.zip
            dist/SHA256SUMS.txt
