name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Green-light gate: run the full Verify suite (pytest matrix + ruff + mypy ratchet + benchmarks +
  # ring-recovery + CLI e2e, and the Studio lint/typecheck/unit/smoke/UI job) BEFORE building or
  # publishing. build-release needs this, so a tag push whose code is red never ships an asset.
  verify:
    uses: ./.github/workflows/verify.yml

  build-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install Studio dependencies
        working-directory: studio
        run: npm ci

      - name: Build Beta release assets
        run: python scripts/build_beta_release.py --root .

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/asteria_runtime-*.whl
            dist/asteria-studio-*.zip
            dist/asteria-beta-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: beta-release-assets
          path: |
            dist/asteria_runtime-*.whl
            dist/asteria-studio-*.zip
            dist/asteria-beta-*.zip
            dist/SHA256SUMS.txt
