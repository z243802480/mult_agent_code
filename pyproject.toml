[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asteria-runtime"
version = "0.1.1"
description = "Local-first multi-agent autonomous development runtime"
requires-python = ">=3.11"
dependencies = [
  "tzdata; platform_system == 'Windows'"
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.12",
  "mypy==1.20.2"
]
future = [
  "typer",
  "pydantic",
  "pydantic-settings",
  "jsonschema",
  "rich",
  "httpx"
]

[project.scripts]
asteria = "asteria_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asteria_runtime = [
  "schemas/*.json",
  "templates/*"
]

[tool.pytest.ini_options]
addopts = ["-m", "not real_provider"]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "contract: public contracts such as schema, policy, merge gate, security, and compatibility invariants",
  "workflow: user-visible runtime workflows such as plan, run, execute, debug, review, and resume",
  "release_gate: release validation reports, acceptance gates, capability reports, and weekly reports",
  "real_provider: tests for real-model smoke, acceptance, routing, and fake-provider rejection",
  "real_provider_smoke: real-provider smoke and route gate tests",
  "real_provider_validation: real-provider validation acceptance tests and validation contracts",
  "real_provider_core: real-provider core/nightly acceptance contracts",
  "mcp_official_smoke: official MCP server stdio smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
